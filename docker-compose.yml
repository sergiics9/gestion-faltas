services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - ./frontend/dist/frontend/browser:/var/www/frontend:ro
    depends_on:
      - laravel

  laravel:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/var/www
      - /var/www/vendor
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=intermod
      - DB_USERNAME=intermod
      - DB_PASSWORD=secret
    env_file:
      - ./backend/.env
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: intermod
      MYSQL_USER: intermod
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootsecret"]
      interval: 5s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:latest
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: rootsecret
    ports:
      - "8080:80"
    depends_on:
      - mysql

  bind9:
    image: ubuntu/bind9:latest
    ports:
      - "53:53/udp"
      - "53:53/tcp"
    volumes:
      - ./docker/bind9/named.conf.options:/etc/bind/named.conf.options:ro
      - ./docker/bind9/zones:/var/lib/bind:rw
    cap_add:
      - NET_RAW
      - NET_BIND_SERVICE

volumes:
  mysql_data:
