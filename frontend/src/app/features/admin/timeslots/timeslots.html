<div class="d-flex justify-content-between align-items-center mb-3">
  <h2 class="h5 mb-0">Franjas horarias</h2>
  <button type="button" class="btn btn-primary" (click)="openCreate()">Nueva franja</button>
</div>
@if (loading()) {
  <p class="text-muted">Cargando...</p>
} @else {
  <table class="table table-bordered">
    <thead class="table-light">
      <tr><th>Inicio</th><th>Fin</th><th></th></tr>
    </thead>
    <tbody>
      @for (t of list(); track t.id) {
        <tr>
          <td>{{ t.start_time }}</td>
          <td>{{ t.end_time }}</td>
          <td>
            <button type="button" class="btn btn-sm btn-outline-primary me-1" (click)="openEdit(t)">Editar</button>
            <button type="button" class="btn btn-sm btn-outline-danger" (click)="delete(t)">Eliminar</button>
          </td>
        </tr>
      }
    </tbody>
  </table>
}
@if (modalOpen()) {
  <div class="modal show d-block" style="background: rgba(0,0,0,0.5);">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">{{ editId() ? 'Editar franja' : 'Nueva franja' }}</h5>
          <button type="button" class="btn-close" (click)="close()"></button>
        </div>
        <div class="modal-body">
          <div class="mb-2">
            <label class="form-label">Centro</label>
            <select class="form-select" [ngModel]="form().center_id" (ngModelChange)="setForm({ center_id: $event })">
              @for (c of centers; track c.id) { <option [value]="c.id">{{ c.name }}</option> }
            </select>
          </div>
          <div class="mb-2">
            <label class="form-label">Hora inicio</label>
            <input type="time" class="form-control" [ngModel]="form().start_time" (ngModelChange)="setForm({ start_time: $event })" />
          </div>
          <div class="mb-2">
            <label class="form-label">Hora fin</label>
            <input type="time" class="form-control" [ngModel]="form().end_time" (ngModelChange)="setForm({ end_time: $event })" />
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" (click)="close()">Cancelar</button>
          <button type="button" class="btn btn-primary" (click)="save()" [disabled]="saving()">Guardar</button>
        </div>
      </div>
    </div>
  </div>
}
