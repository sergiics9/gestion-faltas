<div class="login-container d-flex justify-content-center align-items-center">
  <div class="row w-100 justify-content-center">
    <div class="col-12 col-md-6 col-lg-4">

      <div class="card login-card shadow-lg border-0">
        <div class="card-body p-5">
          <h3 class="text-center mb-4 fw-bold title-text">Iniciar Sesión</h3>

          <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
            <div class="mb-3">
              <label for="username" class="form-label fw-semibold">Usuario</label>
              <input type="text" class="form-control custom-input" id="username" formControlName="username"
                placeholder="Ingresa tu usuario">

              @if (loginForm.controls.username.invalid && loginForm.controls.username.touched) {
              <div class="text-danger mt-1 small">
                El usuario es obligatorio
              </div>
              }
            </div>

            <div class="mb-3">
              <label for="password" class="form-label fw-semibold">Contraseña</label>
              <input type="password" class="form-control custom-input" id="password" formControlName="password"
                placeholder="••••••••">
              @if (loginForm.controls.password.invalid && loginForm.controls.password.touched) {
              <div class="text-danger mt-1 small">
                La contraseña es obligatoria
              </div>
              }
            </div>

            <div class="d-grid gap-2 mt-4">
              <button type="submit" class="btn btn-primary custom-btn fw-bold">
                Enviar
              </button>
            </div>

          </form>
        </div>
      </div>

    </div>
  </div>
</div>
